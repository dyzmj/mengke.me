# Mengke.me Workflow Add Or Update Blog Post With Images

## Action

Follow the add-or-update-blog-post-with-images workflow:
1. Create or modify an MDX file for the blog post in data/blog/YYYYMM/Post_Title.mdx
2. Add or update associated images/videos in public/static/images/blog/YYYYMM/Post_Title/
3. Update tag or metadata files as needed (e.g., json/tag-data.json)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: data/blog/YYYYMM/Post_Title.mdx, public/static/images/blog/YYYYMM/Post_Title/*.{jpg,jpeg,png,mp4}, json/tag-data.json

